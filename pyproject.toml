[project]
name = "cdlc-bajo"
version = "2.7"
description = "De mp3 a tablatura de bajo + mapa de beats para Editor on Fire / Rocksmith 2014"
requires-python = ">=3.13,<3.14"
dependencies = [
    "numpy>=2",
    "scipy>=1.13",
    "librosa>=0.10",
    "soundfile>=0.12",
    "audioread>=3",
    "pretty_midi>=0.2.10",
    "PyGuitarPro>=0.9",
    "audio-separator[cpu]==0.48.0",
    "madmom==0.17.dev0+puro",
    "mido>=1.2.6",
    "imageio-ffmpeg>=0.5",
    "mutagen>=1.47",
    "pillow>=10",
    "pyloudnorm>=0.1.1",
    "beat-this==1.1.0",
    "torchcrepe==0.0.24",
]

[tool.uv]
package = false

[tool.uv.sources]
madmom = { path = "vendor/madmom-0.17.dev0+puro-py3-none-any.whl" }
